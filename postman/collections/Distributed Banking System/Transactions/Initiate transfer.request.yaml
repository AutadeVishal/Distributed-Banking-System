$kind: http-request
url: "{{baseUrl}}:8081/api/v1/transaction/transfer"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: text
  content: |-
    {
      "senderAccountNumber": "50563865636762849283",
      "receiverAccountNumber": "27564023181923056520",
      "amount": 100.00,
      "description": "Postman test transfer"
    }
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      if (response.transactionId !== undefined) {
          pm.collectionVariables.set('transactionId', String(response.transactionId));
      }
    language: text/javascript
order: 1000
