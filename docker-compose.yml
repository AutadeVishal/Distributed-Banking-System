services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:29092"
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  account-service:
    image: account-service:1.0
    container_name: account-service
    build:
      context: .
      args:
        SERVICE: account-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8081:8081"
  transaction-service:
    image: transaction-service:1.0
    container_name: transaction-service
    build:
      context: .
      args:
        SERVICE: transaction-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8082:8082"
  payment-service:
    image: payment-service:1.0
    container_name: payment-service
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8083:8083"
  fraud-detection-service:
    image: fraud-detection-service:1.0
    container_name: fraud-detection-service
    build:
      context: .
      args:
        SERVICE: fraud-detection-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8084:8084"
  notification-service:
    image: notification-service:1.0
    container_name: notification-service
    build:
      context: .
      args:
        SERVICE: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8085:8085"
  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka: { condition: service_healthy }
    ports:
      - "8080:8080"

volumes:
  postgres-data: