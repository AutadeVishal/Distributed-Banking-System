services:

  # =========================
  # DATABASE
  # =========================

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking-network


  # =========================
  # REDIS
  # =========================

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - banking-network


  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - banking-network
  # =========================
  # ACCOUNT SERVICE
  # =========================

  account-service:
    image: account-service:1.0
    container_name: account-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - banking-network


  # =========================
  # TRANSACTION SERVICE
  # =========================

  transaction-service:
    image: transaction-service:1.0
    container_name: transaction-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
      - account-service
    networks:
      - banking-network


  # =========================
  # PAYMENT SERVICE
  # =========================

  payment-service:
    image: payment-service:1.0
    container_name: payment-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    networks:
      - banking-network


  # =========================
  # FRAUD SERVICE
  # =========================

  fraud-detection-service:
    image: fraud-detection-service:1.0
    container_name: fraud-detection-service
    ports:
      - "8084:8084"
    depends_on:
      - redis
      - kafka
      - account-service
    networks:
      - banking-network


  # =========================
  # NOTIFICATION SERVICE
  # =========================

  notification-service:
    image: notification-service:1.0
    container_name: notification-service
    ports:
      - "8085:8085"
    depends_on:
      - kafka
    networks:
      - banking-network


  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - account-service
      - transaction-service
      - payment-service
    networks:
      - banking-network


# =========================
# NETWORK + VOLUME
# =========================

networks:
  banking-network:
    driver: bridge

volumes:
  postgres-data: